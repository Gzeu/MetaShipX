[package]
name = "battleship-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"

[dependencies.battleship]
path = ".."

[dependencies.multiversx-sc-wasm-adapter]
version = "0.45.0"

[workspace]
members = [".", ".."]
