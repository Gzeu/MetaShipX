version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ✅ AUDIT: run as non-root node user
    user: "node"
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://metashipx:${DB_PASSWORD}@postgres:5432/metashipx?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      MX_WEBHOOK_PUBKEY: ${MX_WEBHOOK_PUBKEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # ✅ AUDIT: no unnecessary capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    # ✅ AUDIT: run as non-root
    user: "postgres"
    environment:
      POSTGRES_USER: metashipx
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: metashipx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metashipx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BATTLESHIP_ADDRESS: ${VITE_BATTLESHIP_ADDRESS}
        VITE_NFT_ADDRESS: ${VITE_NFT_ADDRESS}
        VITE_STAKING_ADDRESS: ${VITE_STAKING_ADDRESS}
        VITE_MARKETPLACE_ADDRESS: ${VITE_MARKETPLACE_ADDRESS}
        VITE_TOURNAMENT_ADDRESS: ${VITE_TOURNAMENT_ADDRESS}
        VITE_LEADERBOARD_ADDRESS: ${VITE_LEADERBOARD_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
