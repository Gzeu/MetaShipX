name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_MX_API_URL: ${{ vars.VITE_MX_API_URL }}
          VITE_MX_EXPLORER_URL: ${{ vars.VITE_MX_EXPLORER_URL }}
          VITE_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          VITE_BATTLESHIP_CONTRACT: ${{ vars.BATTLESHIP_CONTRACT }}
          VITE_NFT_CONTRACT: ${{ vars.NFT_CONTRACT }}
          VITE_STAKING_CONTRACT: ${{ vars.STAKING_CONTRACT }}
          VITE_API_URL: ${{ vars.API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend/dist
          vercel-args: '--prod'

  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: metashipx-api
