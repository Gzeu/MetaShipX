name: E2E Tests (Playwright)

on:
  push:
    branches: [main, next-massive-update, feature/**]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/e2e/**'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tests/e2e/**'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Copy E2E config
        run: cp tests/e2e/playwright.config.ts frontend/playwright.config.ts

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_ENV: devnet
          VITE_BATTLESHIP_ADDRESS: erd1qqqqqqqqqqqqqpgqtest000000000000000000000000000000000000000
          VITE_NFT_ADDRESS:        erd1qqqqqqqqqqqqqpgqtest000000000000000000000000000000000000001
          VITE_STAKING_ADDRESS:    erd1qqqqqqqqqqqqqpgqtest000000000000000000000000000000000000002
          VITE_MARKETPLACE_ADDRESS: erd1qqqqqqqqqqqqqpgqtest000000000000000000000000000000000000003
          VITE_TOURNAMENT_ADDRESS: erd1qqqqqqqqqqqqqpgqtest000000000000000000000000000000000000004

      - name: Run E2E tests
        run: cd frontend && npx playwright test --config=playwright.config.ts
        env:
          FRONTEND_URL: http://localhost:4173
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
